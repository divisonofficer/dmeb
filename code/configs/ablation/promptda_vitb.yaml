# PromptDA depth completion (DINOv2 + DPT)
# Traditional sparse-to-dense depth completion method

depth_mode: promptda

# PromptDA specific
promptda_encoder: vits
promptda_ckpt: modules/depth_densify/PromptDA/pretrained/promptda_small_t.ckpt

# Unused for this mode
depthprompt_backbone: da_b
depthprompt_prop_time: 3
bpnet_ckpt: null
ransac_iters: 100

# Training parameters
batch_size: 6
lr: 0.0001
epochs: 20
num_workers: 4
